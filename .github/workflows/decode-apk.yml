
name: Decode APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.apk'

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find APK
        id: apk
        run: |
          APK=$(find . -maxdepth 1 -type f -iname "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "No APK found in root!"
            exit 1
          fi

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Apktool
        run: |
          wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool
          wget https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -O apktool.jar

          echo "dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  apktool.jar" | sha256sum -c -

          chmod +x apktool
          sudo mv apktool /usr/local/bin/apktool
          sudo mv apktool.jar /usr/local/bin/apktool.jar

      - name: Decode APK
        run: |
          apktool d "${{ steps.apk.outputs.apk }}" -o decoded_temp -f
          cp -a decoded_temp/. .
          rm -rf decoded_temp

      - name: Commit decoded files to root
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Automatically decode APK"
            git push
          fi
